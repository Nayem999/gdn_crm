# The gate, run on every push and every pull request.
#
# It is the same gate the working agreement requires locally — Pint, PHPStan,
# the full test suite — plus the coverage threshold the brief sets, which
# cannot be measured on a machine with no coverage driver. CI is where that
# number is enforced.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  # A second push to the same branch cancels the first: the older run is
  # answering a question nobody is asking any more.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        # MySQL 8, matching the mandated stack. Not SQLite: the suite relies on
        # real foreign keys and on MySQL's own behaviour around ONLY_FULL_GROUP_BY
        # and unsigned arithmetic, both of which SQLite allows silently.
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, redis, gd, zip, bcmath, intl, imap
          # pcov rather than xdebug: it measures line coverage at a fraction of
          # the cost, and the suite is long enough already.
          coverage: pcov

      - name: Cache composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Cache node packages
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-

      - name: Install and build the front end
        run: |
          npm ci
          npm run build

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Formatting first: it is the fastest check, and a failure here is the
      # cheapest one to fix.
      - name: Pint
        run: ./vendor/bin/pint --test

      - name: PHPStan
        run: ./vendor/bin/phpstan analyse --no-progress

      - name: Migrate
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan migrate --force

      - name: Tests, with coverage
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: root
          REDIS_HOST: 127.0.0.1
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
        # The brief's threshold: 80% of app/Domain. --min fails the build below
        # it, so the number is enforced rather than reported.
        run: |
          php artisan test \
            --coverage \
            --min=80 \
            --coverage-clover=coverage.xml

      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # A dependency with a published advisory is a hole somebody else found
      # for us. Run on its own so it reports even when the gate is red.
      - name: Audit dependencies
        run: composer audit --no-interaction
